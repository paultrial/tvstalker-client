<section class="page">
  <h1>Reset password</h1>

  <ng-container [ngSwitch]="status()">
    <p *ngSwitchCase="'checking'" class="muted">Validating your token...</p>
    <p *ngSwitchCase="'invalid'" class="muted">This reset link is invalid or expired.</p>
    <div *ngSwitchCase="'ready'">
      <form [formGroup]="form" (ngSubmit)="submit()">
        <label>
          New password
          <input type="password" formControlName="password" placeholder="Enter a new password" />
        </label>
        <button type="submit">Update password</button>
      </form>
    </div>
    <p *ngSwitchCase="'done'" class="muted">{{ message() }}</p>
  </ng-container>

  <p class="message" *ngIf="message() && status() !== 'done'">{{ message() }}</p>
</section>
