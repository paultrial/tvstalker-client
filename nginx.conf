server {
    listen 8084;
    server_name _;

    # Adjust to your deployment path where `npm run build` output is placed:
    # e.g., /var/www/tvstalker-client or /usr/share/nginx/html
    root /var/www/tvstalker-client;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public";
    }

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
